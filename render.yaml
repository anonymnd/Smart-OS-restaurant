services:
  - type: web
    name: smart-restaurant-os
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci && npm run build
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VITE_API_URL
        value: ""
      - key: DATABASE_URL
        sync: false
